<!DOCTYPE html>
<html lang="en">

<head>
    <title>Kanban-Board</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main>
        <nav>
            <div class="left">Kanban-Board</div>
            <div class="right"><button>Add New Task</button></div>
        </nav>
        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To-Do</div>
                    <div class="right">Count</div>
                </div>
                <div draggable="true" class="task">
                    <div class="task-tile">
                        <h2>Task-1</h2>
                        <p>Description for Task 1</p>
                        <button>Delete</button>
                    </div>
                </div>
            </div>
            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In-Progress</div>
                    <div class="right">Count</div>
                </div>
            </div>
            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
            </div>
        </section>
    </main>

    <script src="index.js"></script>

</body>

</html>
